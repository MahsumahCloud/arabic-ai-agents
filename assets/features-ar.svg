  <text x="1212.0" y="158" text-anchor="end" font-family="'Estedad','IBM Plex Sans Arabic','Noto Kufi Arabic','Noto Sans Arabic','Segoe UI','Geeza Pro',Arial,Tahoma,sans-serif" font-size="21" font-weight="800" fill="#0B0B0C">‫مستندات عربية حقيقية‬</text>
  <text x="1212.0" y="192" text-anchor="end" font-family="'IBM Plex Sans Arabic','Estedad','Noto Sans Arabic','Segoe UI','Geeza Pro',Arial,Tahoma,sans-serif" font-size="16" fill="#55534E">‫بحث يفهم العربية: يوحّد صور الألف والتاء المربوطة،‬</text>
  <text x="1212.0" y="218" text-anchor="end" font-family="'IBM Plex Sans Arabic','Estedad','Noto Sans Arabic','Segoe UI','Geeza Pro',Arial,Tahoma,sans-serif" font-size="16" fill="#55534E">‫ويحذف التشكيل، ويقرأ الأرقام الهندية.‬</text>
  <rect x="448.0" y="40" width="384.0" height="236" rx="20" fill="#FFFFFF" stroke="#E4E0D4" stroke-width="1" filter="url(#fars)"/>
  <rect x="752.00" y="68.00" width="52" height="52" rx="14.0" fill="#F7F4EC"/><g transform="translate(752.00 68.00) scale(1.0833)" fill="none" stroke="#0B0B0C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 37 V11"/><path d="M16 12.5 H33 L28.5 18.5 L33 24.5 H16"/></g>
  <text x="804.0" y="158" text-anchor="end" font-family="'Estedad','IBM Plex Sans Arabic','Noto Kufi Arabic','Noto Sans Arabic','Segoe UI','Geeza Pro',Arial,Tahoma,sans-serif" font-size="21" font-weight="800" fill="#0B0B0C">‫أمثلة من بيئتنا‬</text>
  <text x="804.0" y="192" text-anchor="end" font-family="'IBM Plex Sans Arabic','Estedad','Noto Sans Arabic','Segoe UI','Geeza Pro',Arial,Tahoma,sans-serif" font-size="16" fill="#55534E">‫النخلة ومراحل التمر، والتقويم الهجري ورمضان، والوقت في‬</text>
  <text x="804.0" y="218" text-anchor="end" font-family="'IBM Plex Sans Arabic','Estedad','Noto Sans Arabic','Segoe UI','Geeza Pro',Arial,Tahoma,sans-serif" font-size="16" fill="#55534E">‫الرياض، وحاسبة تقبل الأرقام الهندية (٠١٢٣).‬</text>
