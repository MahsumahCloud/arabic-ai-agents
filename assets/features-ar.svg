  <text x="396.0" y="418" text-anchor="end" font-family="'Estedad','IBM Plex Sans Arabic','Noto Kufi Arabic','Noto Sans Arabic','Segoe UI','Geeza Pro',Arial,Tahoma,sans-serif" font-size="21" font-weight="800" fill="#0B0B0C">‫اختبارات بلا مفتاح‬</text>
  <text x="396.0" y="452" text-anchor="end" font-family="'IBM Plex Sans Arabic','Estedad','Noto Sans Arabic','Segoe UI','Geeza Pro',Arial,Tahoma,sans-serif" font-size="16" fill="#55534E">‫كل مثال له اختبار يعمل دون اتصال بعميل وهمي، فتتعلّم‬</text>
  <text x="396.0" y="478" text-anchor="end" font-family="'IBM Plex Sans Arabic','Estedad','Noto Sans Arabic','Segoe UI','Geeza Pro',Arial,Tahoma,sans-serif" font-size="16" fill="#55534E">‫دون أن تدفع شيئاً.‬</text>
