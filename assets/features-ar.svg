  <rect x="344.00" y="68.00" width="52" height="52" rx="14.0" fill="#F7F4EC"/><g transform="translate(344.00 68.00) scale(1.0833)" fill="none" stroke="#0B0B0C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 35.5 H36"/><path d="M15 35.5 V26 H20 V35.5"/><path d="M21.5 35.5 V20 H26.5 V35.5"/><path d="M28 35.5 V13 H33 V35.5"/></g>
  <text x="396.0" y="158" text-anchor="end" font-family="'Estedad','IBM Plex Sans Arabic','Noto Kufi Arabic','Noto Sans Arabic','Segoe UI','Geeza Pro',Arial,Tahoma,sans-serif" font-size="21" font-weight="800" fill="#0B0B0C">‫انضباط في الكلفة‬</text>
  <text x="396.0" y="192" text-anchor="end" font-family="'IBM Plex Sans Arabic','Estedad','Noto Sans Arabic','Segoe UI','Geeza Pro',Arial,Tahoma,sans-serif" font-size="16" fill="#55534E">‫حدّ للكلفة يُفحص قبل كل طلب، وكلفة كل سؤال تُطبع أمامك،‬</text>
  <text x="396.0" y="218" text-anchor="end" font-family="'IBM Plex Sans Arabic','Estedad','Noto Sans Arabic','Segoe UI','Geeza Pro',Arial,Tahoma,sans-serif" font-size="16" fill="#55534E">‫وجدول أسعار واحد مؤرَّخ.‬</text>
  <rect x="856.0" y="300" width="384.0" height="236" rx="20" fill="#FFFFFF" stroke="#E4E0D4" stroke-width="1" filter="url(#fars)"/>
  <rect x="1160.00" y="328.00" width="52" height="52" rx="14.0" fill="#FFD619"/><g transform="translate(1160.00 328.00) scale(1.0833)" fill="none" stroke="#0B0B0C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M24 11 L34 15 V23 C34 30 29.5 34.5 24 37 C18.5 34.5 14 30 14 23 V15 Z"/><path d="M19.5 24 L22.8 27.3 L28.8 20.8"/></g>
  <text x="1212.0" y="418" text-anchor="end" font-family="'Estedad','IBM Plex Sans Arabic','Noto Kufi Arabic','Noto Sans Arabic','Segoe UI','Geeza Pro',Arial,Tahoma,sans-serif" font-size="21" font-weight="800" fill="#0B0B0C">‫استشهادات تُفحص لا تُصدَّق‬</text>
  <text x="1212.0" y="452" text-anchor="end" font-family="'IBM Plex Sans Arabic','Estedad','Noto Sans Arabic','Segoe UI','Geeza Pro',Arial,Tahoma,sans-serif" font-size="16" fill="#55534E">‫كل مصدر في الجواب يُصنَّف: صحيح، أو غير موجود، أو‬</text>
  <text x="1212.0" y="478" text-anchor="end" font-family="'IBM Plex Sans Arabic','Estedad','Noto Sans Arabic','Segoe UI','Geeza Pro',Arial,Tahoma,sans-serif" font-size="16" fill="#55534E">‫لم يقرأه الوكيل أصلاً.‬</text>
  <rect x="448.0" y="300" width="384.0" height="236" rx="20" fill="#FFFFFF" stroke="#E4E0D4" stroke-width="1" filter="url(#fars)"/>
  <rect x="752.00" y="328.00" width="52" height="52" rx="14.0" fill="#F7F4EC"/><g transform="translate(752.00 328.00) scale(1.0833)" fill="none" stroke="#0B0B0C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M29.5 13.5 a6.5 6.5 0 0 0 -7.6 8.4 L13.6 30.2 a2.6 2.6 0 0 0 3.7 3.7 L25.6 25.6 a6.5 6.5 0 0 0 8.4 -7.6 l-3.9 3.9 -3.6 -0.6 -0.6 -3.6 z"/></g>
  <text x="804.0" y="418" text-anchor="end" font-family="'Estedad','IBM Plex Sans Arabic','Noto Kufi Arabic','Noto Sans Arabic','Segoe UI','Geeza Pro',Arial,Tahoma,sans-serif" font-size="21" font-weight="800" fill="#0B0B0C">‫من الصفر، بلا إطار عمل‬</text>
  <text x="804.0" y="452" text-anchor="end" font-family="'IBM Plex Sans Arabic','Estedad','Noto Sans Arabic','Segoe UI','Geeza Pro',Arial,Tahoma,sans-serif" font-size="16" fill="#55534E">‫حلقة الأدوات تكتبها بيدك، وأدوات آمنة بلا eval، وحذف لا‬</text>
  <text x="804.0" y="478" text-anchor="end" font-family="'IBM Plex Sans Arabic','Estedad','Noto Sans Arabic','Segoe UI','Geeza Pro',Arial,Tahoma,sans-serif" font-size="16" fill="#55534E">‫يتم إلا بموافقتك.‬</text>
  <rect x="40.0" y="300" width="384.0" height="236" rx="20" fill="#FFFFFF" stroke="#E4E0D4" stroke-width="1" filter="url(#fars)"/>
