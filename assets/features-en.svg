<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 576" width="1280" height="576" role="img" aria-labelledby="fent" lang="en">
  <title id="fent">What makes this course different</title>
  <defs>
    <pattern id="fenp" width="56" height="56" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#0B0B0C" stroke-width="1">
        <path d="M28.0 15.0 L41.0 28.0 L28.0 41.0 L15.0 28.0 Z"/>
        <path d="M28.0 22.0 L34.0 28.0 L28.0 34.0 L22.0 28.0 Z" opacity="0.6"/>
      </g>
      <g fill="#0B0B0C"><circle cx="0" cy="0" r="1.3"/><circle cx="56" cy="0" r="1.3"/><circle cx="0" cy="56" r="1.3"/><circle cx="56" cy="56" r="1.3"/></g>
    </pattern>
    <radialGradient id="fenpg" gradientUnits="userSpaceOnUse" cx="640.0" cy="288.0" r="700">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="0.35" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="fenpm"><rect width="100%" height="100%" fill="url(#fenpg)"/></mask>
    <filter id="fens" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0B0B0C" flood-opacity="0.05"/><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B0B0C" flood-opacity="0.1"/></filter>
  </defs>
  <rect width="1280" height="576" rx="24" fill="#F7F4EC"/>
  <rect width="1280" height="576" rx="24" fill="url(#fenp)" opacity="0.05" mask="url(#fenpm)"/>
    <rect x="40.0" y="40" width="384.0" height="236" rx="20" fill="#FFFFFF" stroke="#E4E0D4" stroke-width="1" filter="url(#fens)"/>
  <rect x="68.00" y="68.00" width="52" height="52" rx="14.0" fill="#FFD619"/><g transform="translate(68.00 68.00) scale(1.0833)" fill="none" stroke="#0B0B0C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 11 H25 L31 17 V27"/><path d="M25 11 V17 H31"/><path d="M14 11 V36 H22"/><path d="M18 22 H25"/><path d="M18 27 H21"/><path d="M30 35.5 a5.5 5.5 0 1 0 0 -11 a5.5 5.5 0 1 0 0 11 z"/><path d="M34 34 L37.5 37.5"/></g>
  <text x="68.0" y="158" text-anchor="start" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="800" fill="#0B0B0C">Real Arabic documents</text>
  <text x="68.0" y="192" text-anchor="start" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#55534E">A search that understands Arabic: it unifies</text>
  <text x="68.0" y="218" text-anchor="start" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#55534E">alef and taa marbuta forms, strips diacritics,</text>
  <text x="68.0" y="244" text-anchor="start" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#55534E">and reads Arabic-Indic digits.</text>
  <rect x="448.0" y="40" width="384.0" height="236" rx="20" fill="#FFFFFF" stroke="#E4E0D4" stroke-width="1" filter="url(#fens)"/>
  <rect x="476.00" y="68.00" width="52" height="52" rx="14.0" fill="#F7F4EC"/><g transform="translate(476.00 68.00) scale(1.0833)" fill="none" stroke="#0B0B0C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 37 V11"/><path d="M16 12.5 H33 L28.5 18.5 L33 24.5 H16"/></g>
  <text x="476.0" y="158" text-anchor="start" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="800" fill="#0B0B0C">Examples from the region</text>
  <text x="476.0" y="192" text-anchor="start" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#55534E">Date palms and the stages of the fruit, the</text>
  <text x="476.0" y="218" text-anchor="start" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#55534E">Hijri calendar and Ramadan, the time in</text>
  <text x="476.0" y="244" text-anchor="start" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#55534E">Riyadh, and a calculator that accepts</text>
  <text x="476.0" y="270" text-anchor="start" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#55534E">Arabic-Indic digits.</text>
  <rect x="856.0" y="40" width="384.0" height="236" rx="20" fill="#FFFFFF" stroke="#E4E0D4" stroke-width="1" filter="url(#fens)"/>
  <rect x="884.00" y="68.00" width="52" height="52" rx="14.0" fill="#F7F4EC"/><g transform="translate(884.00 68.00) scale(1.0833)" fill="none" stroke="#0B0B0C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 35.5 H36"/><path d="M15 35.5 V26 H20 V35.5"/><path d="M21.5 35.5 V20 H26.5 V35.5"/><path d="M28 35.5 V13 H33 V35.5"/></g>
  <text x="884.0" y="158" text-anchor="start" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="800" fill="#0B0B0C">Cost discipline</text>
  <text x="884.0" y="192" text-anchor="start" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#55534E">A cost budget checked before every call, the</text>
  <text x="884.0" y="218" text-anchor="start" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#55534E">cost of each question printed in front of you,</text>
  <text x="884.0" y="244" text-anchor="start" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#55534E">and one dated price table.</text>
  <rect x="40.0" y="300" width="384.0" height="236" rx="20" fill="#FFFFFF" stroke="#E4E0D4" stroke-width="1" filter="url(#fens)"/>
  <rect x="68.00" y="328.00" width="52" height="52" rx="14.0" fill="#FFD619"/><g transform="translate(68.00 328.00) scale(1.0833)" fill="none" stroke="#0B0B0C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M24 11 L34 15 V23 C34 30 29.5 34.5 24 37 C18.5 34.5 14 30 14 23 V15 Z"/><path d="M19.5 24 L22.8 27.3 L28.8 20.8"/></g>
  <text x="68.0" y="418" text-anchor="start" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="800" fill="#0B0B0C">Citations checked, not trusted</text>
  <text x="68.0" y="452" text-anchor="start" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#55534E">Every source in an answer is classified: valid,</text>
  <text x="68.0" y="478" text-anchor="start" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#55534E">nonexistent, or never actually read by the</text>
  <text x="68.0" y="504" text-anchor="start" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#55534E">agent.</text>
  <rect x="448.0" y="300" width="384.0" height="236" rx="20" fill="#FFFFFF" stroke="#E4E0D4" stroke-width="1" filter="url(#fens)"/>
  <rect x="476.00" y="328.00" width="52" height="52" rx="14.0" fill="#F7F4EC"/><g transform="translate(476.00 328.00) scale(1.0833)" fill="none" stroke="#0B0B0C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M29.5 13.5 a6.5 6.5 0 0 0 -7.6 8.4 L13.6 30.2 a2.6 2.6 0 0 0 3.7 3.7 L25.6 25.6 a6.5 6.5 0 0 0 8.4 -7.6 l-3.9 3.9 -3.6 -0.6 -0.6 -3.6 z"/></g>
  <text x="476.0" y="418" text-anchor="start" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="800" fill="#0B0B0C">From scratch, no framework</text>
  <text x="476.0" y="452" text-anchor="start" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#55534E">You write the tool loop by hand, build safe</text>
  <text x="476.0" y="478" text-anchor="start" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#55534E">tools without eval, and deletion only happens</text>
  <text x="476.0" y="504" text-anchor="start" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#55534E">with your approval.</text>
  <rect x="856.0" y="300" width="384.0" height="236" rx="20" fill="#FFFFFF" stroke="#E4E0D4" stroke-width="1" filter="url(#fens)"/>
  <rect x="884.00" y="328.00" width="52" height="52" rx="14.0" fill="#F7F4EC"/><g transform="translate(884.00 328.00) scale(1.0833)" fill="none" stroke="#0B0B0C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 17 L21 24 L14 31"/><path d="M24 31 H34"/></g>
  <text x="884.0" y="418" text-anchor="start" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="800" fill="#0B0B0C">Tests with no API key</text>
  <text x="884.0" y="452" text-anchor="start" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#55534E">Every example has a test that runs offline</text>
  <text x="884.0" y="478" text-anchor="start" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#55534E">with a mock client, so you can learn without</text>
  <text x="884.0" y="504" text-anchor="start" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#55534E">paying anything.</text>
</svg>
