<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="sfent sfend" lang="en">
  <title id="sfent">Spec-driven development: five steps and two side paths</title>
  <desc id="sfend">The constitution once per project, then for every feature: specify, plan, tasks, implement, with a review gate before implementing and a converge loop that adds missing tasks. Below, two paths: fixing a bug in three steps ending in verified, partial or failed, and assessing an idea in five steps ending in go, clarify or stop, where go hands over to Specify.</desc>
