<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="tlt tld" lang="ar">
  <title id="tlt">حلقة استخدام الأدوات</title>
  <desc id="tld">مخطط تسلسلي: شيفرتك ترسل المحادثة وتعريفات الأدوات، والنموذج يطلب أداة، وشيفرتك تتحقق وتنفّذ وتعيد كل النتائج في رسالة واحدة، ثم يجيب النموذج.</desc>
