<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="sfart sfard" lang="ar">
  <title id="sfart">التطوير الموجّه بالمواصفات: خمس خطوات، ومساران جانبيان</title>
  <desc id="sfard">الدستور مرة واحدة لكل مشروع، ثم لكل ميزة: المواصفات ثم الخطة ثم المهام ثم التنفيذ، مع بوابة مراجعة قبل التنفيذ وحلقة تقارب تضيف المهام الناقصة. وتحتها مساران: إصلاح خطأ بثلاث خطوات ينتهي بحكم تحقّق أو جزئي أو فشل، وتقييم فكرة بخمس خطوات ينتهي بقرار امضِ أو وضّح أو توقّف، و«امضِ» تنتقل إلى المواصفات.</desc>
