<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="tlt tld" lang="en">
  <title id="tlt">The tool-use loop</title>
  <desc id="tld">Sequence: your code sends messages and tool definitions, the model asks for a tool, your code validates and runs it, sends every result back in one message, and the model answers.</desc>
  <defs>
    <linearGradient id="tlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="tlgh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="tldots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1a2442"/>
    </pattern>
    <marker id="tlac" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0.5 L10 5 L0 9.5 z" fill="#22d3ee"/>
    </marker>
    <marker id="tlav" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0.5 L10 5 L0 9.5 z" fill="#a78bfa"/>
    </marker>
    <marker id="tlar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0.5 L10 5 L0 9.5 z" fill="#fb7185"/>
    </marker>
    <marker id="tlam" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0.5 L10 5 L0 9.5 z" fill="#8b9bb8"/>
    </marker>
  </defs>
  <rect width="960" height="660" rx="20" fill="#0b1020"/>
  <rect width="960" height="660" rx="20" fill="url(#tldots)" opacity="0.9"/>
  <rect x="0.75" y="0.75" width="958.5" height="658.5" rx="19.5" fill="none" stroke="#1e2a47" stroke-width="1.5"/>
  <path d="M0.75 46 H959.25" stroke="#1e2a47" stroke-width="1.5"/>
  <circle cx="26" cy="23" r="6" fill="#ff5f57" opacity="0.85"/>
  <circle cx="46" cy="23" r="6" fill="#febc2e" opacity="0.85"/>
  <circle cx="66" cy="23" r="6" fill="#28c840" opacity="0.85"/>
  <text x="480.0" y="28" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#8b9bb8">lessons/02/tool_loop.py</text>
  <rect x="80" y="70" width="200" height="64" rx="14" fill="url(#tlg)"/>
  <text x="180" y="100" text-anchor="middle" font-family="'Inter','IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="21" fill="#060a14" font-weight="700">Your code</text>
  <text x="180" y="121" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#0b1630">tool_loop.py</text>
  <line x1="180" y1="136" x2="180" y2="636" stroke="#1e2a47" stroke-width="2" stroke-dasharray="4 7"/>
  <rect x="380" y="70" width="200" height="64" rx="14" fill="#111a33" stroke="#22d3ee" stroke-width="2"/>
  <text x="480" y="100" text-anchor="middle" font-family="'Inter','IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="21" fill="#e6edf7" font-weight="700">Model</text>
  <text x="480" y="121" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#22d3ee">messages.create()</text>
  <line x1="480" y1="136" x2="480" y2="636" stroke="#1e2a47" stroke-width="2" stroke-dasharray="4 7"/>
  <rect x="680" y="70" width="200" height="64" rx="14" fill="#111a33" stroke="#a78bfa" stroke-width="2"/>
  <text x="780" y="100" text-anchor="middle" font-family="'Inter','IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="21" fill="#e6edf7" font-weight="700">Tool</text>
  <text x="780" y="121" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#a78bfa">ToolBox.run()</text>
  <line x1="780" y1="136" x2="780" y2="636" stroke="#1e2a47" stroke-width="2" stroke-dasharray="4 7"/>
