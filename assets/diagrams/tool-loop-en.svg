  <circle cx="180" cy="200" r="13" fill="url(#tlg)"/>
  <text x="180" y="205" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#060a14">1</text>
  <text x="330.0" y="188" text-anchor="middle" font-family="'Inter','IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#e6edf7">messages and tool definitions</text>
  <path d="M462 278 H186" fill="none" stroke="#22d3ee" stroke-width="2.4" stroke-linecap="round" marker-end="url(#tlac)"/>
  <circle cx="480" cy="278" r="13" fill="url(#tlg)"/>
  <text x="480" y="283" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#060a14">2</text>
  <text x="330.0" y="266" text-anchor="middle" font-family="'Inter','IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#e6edf7">asks for a tool</text>
  <text x="330.0" y="302" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#8b9bb8">stop_reason: "tool_use"</text>
  <path d="M198 358 H774" fill="none" stroke="#22d3ee" stroke-width="2.4" stroke-linecap="round" marker-end="url(#tlac)"/>
  <circle cx="180" cy="358" r="13" fill="url(#tlg)"/>
  <text x="180" y="363" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#060a14">3</text>
  <text x="480.0" y="346" text-anchor="middle" font-family="'Inter','IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#e6edf7">validate input, ask approval, then run</text>
  <path d="M762 434 H186" fill="none" stroke="#a78bfa" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#tlav)"/>
  <circle cx="780" cy="434" r="13" fill="url(#tlg)"/>
  <text x="780" y="439" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#060a14">4</text>
  <text x="480.0" y="422" text-anchor="middle" font-family="'Inter','IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#e6edf7">the result, or an error message</text>
  <path d="M198 514 H474" fill="none" stroke="#22d3ee" stroke-width="2.4" stroke-linecap="round" marker-end="url(#tlac)"/>
  <circle cx="180" cy="514" r="13" fill="url(#tlg)"/>
  <text x="180" y="519" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#060a14">5</text>
  <text x="330.0" y="502" text-anchor="middle" font-family="'Inter','IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#e6edf7">all results in one message</text>
  <text x="330.0" y="538" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#8b9bb8">tool_result (is_error)</text>
  <path d="M462 594 H186" fill="none" stroke="#22d3ee" stroke-width="2.4" stroke-linecap="round" marker-end="url(#tlac)"/>
  <circle cx="480" cy="594" r="13" fill="url(#tlg)"/>
  <text x="480" y="599" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#060a14">6</text>
  <text x="330.0" y="582" text-anchor="middle" font-family="'Inter','IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#e6edf7">final answer</text>
  <text x="330.0" y="618" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#8b9bb8">stop_reason: "end_turn"</text>
  <path d="M92 262 H66 V528 H92" fill="none" stroke="#fb7185" stroke-width="2.2" stroke-linecap="round"/>
  <text x="48" y="395" text-anchor="middle" font-family="'Inter','IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#fb7185" transform="rotate(-90 48 395)">repeats until done</text>
</svg>
