<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="alt ald" lang="en">
  <title id="alt">The agent loop: perceive, think, act</title>
  <desc id="ald">Think, act, environment and perceive form a loop. The loop stops when the goal is reached or a step or cost limit is hit.</desc>
  <defs>
    <linearGradient id="alg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="algh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="aldots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1a2442"/>
    </pattern>
    <marker id="alac" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0.5 L10 5 L0 9.5 z" fill="#22d3ee"/>
    </marker>
    <marker id="alav" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0.5 L10 5 L0 9.5 z" fill="#a78bfa"/>
    </marker>
    <marker id="alar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0.5 L10 5 L0 9.5 z" fill="#fb7185"/>
    </marker>
    <marker id="alam" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0.5 L10 5 L0 9.5 z" fill="#8b9bb8"/>
    </marker>
  </defs>
  <rect width="960" height="580" rx="20" fill="#0b1020"/>
  <rect width="960" height="580" rx="20" fill="url(#aldots)" opacity="0.9"/>
  <rect x="0.75" y="0.75" width="958.5" height="578.5" rx="19.5" fill="none" stroke="#1e2a47" stroke-width="1.5"/>
  <path d="M0.75 46 H959.25" stroke="#1e2a47" stroke-width="1.5"/>
  <circle cx="26" cy="23" r="6" fill="#ff5f57" opacity="0.85"/>
