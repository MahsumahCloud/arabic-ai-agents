<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="alt ald" lang="en">
  <title id="alt">The agent loop: perceive, think, act</title>
  <desc id="ald">Think, act, environment and perceive form a loop. The loop stops when the goal is reached or a step or cost limit is hit.</desc>
  <defs>
    <pattern id="alp" width="56" height="56" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#0B0B0C" stroke-width="1">
        <path d="M28.0 15.0 L41.0 28.0 L28.0 41.0 L15.0 28.0 Z"/>
        <path d="M28.0 22.0 L34.0 28.0 L28.0 34.0 L22.0 28.0 Z" opacity="0.6"/>
      </g>
      <g fill="#0B0B0C"><circle cx="0" cy="0" r="1.3"/><circle cx="56" cy="0" r="1.3"/><circle cx="0" cy="56" r="1.3"/><circle cx="56" cy="56" r="1.3"/></g>
    </pattern>
    <radialGradient id="alpg" gradientUnits="userSpaceOnUse" cx="480" cy="300" r="620">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="0.35" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="alpm"><rect width="100%" height="100%" fill="url(#alpg)"/></mask>
    <filter id="als" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0B0B0C" flood-opacity="0.05"/><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B0B0C" flood-opacity="0.1"/></filter>
    <marker id="alac" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5 0.8 L9.5 5 L0.5 9.2 z" fill="#0B0B0C"/></marker><marker id="alav" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5 0.8 L9.5 5 L0.5 9.2 z" fill="#8A8781"/></marker><marker id="alar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5 0.8 L9.5 5 L0.5 9.2 z" fill="#0B0B0C"/></marker><marker id="alam" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5 0.8 L9.5 5 L0.5 9.2 z" fill="#6A6862"/></marker>
  </defs>
  <rect width="960" height="580" rx="20" fill="#F7F4EC"/>
  <rect width="960" height="580" rx="20" fill="url(#alp)" opacity="0.05" mask="url(#alpm)"/>
  <rect x="0.75" y="0.75" width="958.5" height="578.5" rx="19.25" fill="none" stroke="#E2DED2" stroke-width="1.5"/>
  <rect x="22" y="16" width="22" height="22" rx="6" fill="#FFD619"/>
  <path d="M29 22 L34 27 L29 32" fill="none" stroke="#0B0B0C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="54" y="32" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#6A6862">lessons/01/agent_loop_toy.py</text>
  <path d="M584 170 Q722 170 740 298" fill="none" stroke="#0B0B0C" stroke-width="2.5" stroke-linecap="round" marker-end="url(#alac)"/>
  <path d="M740 402 Q740 520 626 520" fill="none" stroke="#0B0B0C" stroke-width="2.5" stroke-linecap="round" marker-end="url(#alac)"/>
  <path d="M334 520 Q220 520 220 402" fill="none" stroke="#8A8781" stroke-width="2.5" stroke-linecap="round" marker-end="url(#alav)"/>
  <path d="M220 298 Q238 170 376 170" fill="none" stroke="#8A8781" stroke-width="2.5" stroke-linecap="round" marker-end="url(#alav)"/>
  <path d="M480 124 V90 H756" fill="none" stroke="#0B0B0C" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#alar)"/>
  <rect x="762" y="68" width="140" height="44" rx="22" fill="#0B0B0C" stroke="#0B0B0C" stroke-width="1.8"/>
  <text x="832" y="96" text-anchor="middle" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="18" fill="#FFD619" font-weight="700">stop</text>
  <text x="832" y="138" text-anchor="middle" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6A6862">goal reached, or</text>
  <text x="832" y="156" text-anchor="middle" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6A6862">a step or cost limit hit</text>
  <rect x="380.0" y="124.0" width="200" height="92" rx="46" fill="#FFD619" stroke="#0B0B0C" stroke-width="2.2"/>
  <text x="480" y="174" text-anchor="middle" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="25" fill="#0B0B0C" font-weight="700">Think</text>
  <text x="480" y="198" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#6A6862">agent.think()</text>
  <rect x="640.0" y="304.0" width="200" height="92" rx="46" fill="#FFFFFF" stroke="#0B0B0C" stroke-width="2.2"/>
  <text x="740" y="354" text-anchor="middle" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="25" fill="#0B0B0C" font-weight="700">Act</text>
  <text x="740" y="378" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#6A6862">env.respond(guess)</text>
  <rect x="120.0" y="304.0" width="200" height="92" rx="46" fill="#FFFFFF" stroke="#0B0B0C" stroke-width="2.2"/>
  <text x="220" y="354" text-anchor="middle" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="25" fill="#0B0B0C" font-weight="700">Perceive</text>
  <text x="220" y="378" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#6A6862">agent.perceive(...)</text>
  <rect x="340.0" y="478.0" width="280" height="84" rx="16" fill="#FFFFFF" stroke="#0B0B0C" stroke-width="2.2" filter="url(#als)"/>
  <text x="480" y="524" text-anchor="middle" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="25" fill="#0B0B0C" font-weight="700">Environment</text>
  <text x="480" y="548" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#6A6862">&quot;higher&quot; | &quot;lower&quot; | &quot;correct&quot;</text>
  <text x="732" y="206" text-anchor="start" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#0B0B0C">what's the next step?</text>
  <text x="762" y="494" text-anchor="start" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#0B0B0C">run a tool</text>
  <text x="198" y="494" text-anchor="end" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#6A6862">result &amp; feedback</text>
  <text x="228" y="206" text-anchor="end" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#6A6862">what do I know now?</text>
  <text x="480" y="342" text-anchor="middle" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#6A6862" font-weight="600">the loop</text>
  <text x="480" y="368" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#9A978F">for _ in range(max_steps):</text>
</svg>
