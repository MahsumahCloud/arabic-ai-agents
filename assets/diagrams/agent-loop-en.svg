  <rect x="640.0" y="304.0" width="200" height="92" rx="46" fill="#111a33" stroke="url(#alg)" stroke-width="2.2"/>
  <text x="740" y="354" text-anchor="middle" font-family="'Inter','IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="25" fill="#e6edf7" font-weight="700">Act</text>
  <text x="740" y="378" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#22d3ee">env.respond(guess)</text>
  <rect x="120.0" y="304.0" width="200" height="92" rx="46" fill="#111a33" stroke="url(#alg)" stroke-width="2.2"/>
  <text x="220" y="354" text-anchor="middle" font-family="'Inter','IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="25" fill="#e6edf7" font-weight="700">Perceive</text>
  <text x="220" y="378" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#22d3ee">agent.perceive(...)</text>
  <rect x="340.0" y="478.0" width="280" height="84" rx="16" fill="#111a33" stroke="url(#alg)" stroke-width="2.2"/>
  <text x="480" y="524" text-anchor="middle" font-family="'Inter','IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="25" fill="#e6edf7" font-weight="700">Environment</text>
  <text x="480" y="548" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#22d3ee">"higher" | "lower" | "correct"</text>
  <text x="732" y="206" text-anchor="start" font-family="'Inter','IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#22d3ee">what's the next step?</text>
  <text x="762" y="494" text-anchor="start" font-family="'Inter','IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#22d3ee">run a tool</text>
  <text x="198" y="494" text-anchor="end" font-family="'Inter','IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#a78bfa">result &amp; feedback</text>
  <text x="228" y="206" text-anchor="end" font-family="'Inter','IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#a78bfa">what do I know now?</text>
  <text x="480" y="342" text-anchor="middle" font-family="'Inter','IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#8b9bb8" font-weight="600">the loop</text>
  <text x="480" y="368" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#56627d">for _ in range(max_steps):</text>
</svg>
