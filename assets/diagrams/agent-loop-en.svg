  <path d="M584 170 Q722 170 740 298" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" marker-end="url(#alac)"/>
  <path d="M740 402 Q740 520 626 520" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" marker-end="url(#alac)"/>
  <path d="M334 520 Q220 520 220 402" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" marker-end="url(#alav)"/>
  <path d="M220 298 Q238 170 376 170" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" marker-end="url(#alav)"/>
  <path d="M480 124 V90 H756" fill="none" stroke="#fb7185" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#alar)"/>
  <rect x="762" y="68" width="140" height="44" rx="22" fill="#2a0f1a" stroke="#fb7185" stroke-width="1.8"/>
  <text x="832" y="96" text-anchor="middle" font-family="'Inter','IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="18" fill="#fb7185" font-weight="700">stop</text>
  <text x="832" y="138" text-anchor="middle" font-family="'Inter','IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#8b9bb8">goal reached, or</text>
  <text x="832" y="156" text-anchor="middle" font-family="'Inter','IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#8b9bb8">a step or cost limit hit</text>
  <rect x="380.0" y="124.0" width="200" height="92" rx="46" fill="#111a33" stroke="url(#alg)" stroke-width="2.2"/>
