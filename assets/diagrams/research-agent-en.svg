<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="rat rad" lang="en">
  <title id="rat">The research assistant</title>
  <desc id="rad">A question enters the agent loop, which plans, searches and reads local documents under a step limit, a cost budget and loop detection; every citation is checked before the answer is returned.</desc>
  <defs>
    <linearGradient id="rag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="ragh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="radots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1a2442"/>
    </pattern>
    <marker id="raac" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0.5 L10 5 L0 9.5 z" fill="#22d3ee"/>
    </marker>
    <marker id="raav" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0.5 L10 5 L0 9.5 z" fill="#a78bfa"/>
    </marker>
    <marker id="raar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0.5 L10 5 L0 9.5 z" fill="#fb7185"/>
    </marker>
    <marker id="raam" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0.5 L10 5 L0 9.5 z" fill="#8b9bb8"/>
    </marker>
  </defs>
  <rect width="960" height="580" rx="20" fill="#0b1020"/>
  <rect width="960" height="580" rx="20" fill="url(#radots)" opacity="0.9"/>
