  <path d="M728 302 H666" fill="none" stroke="#8A8781" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 5" marker-end="url(#raav)"/>
  <path d="M390 444 V480" fill="none" stroke="#0B0B0C" stroke-width="2.5" stroke-linecap="round" marker-end="url(#raac)"/>
  <rect x="280" y="486" width="220" height="60" rx="12" fill="#FFD619" stroke="#0B0B0C" stroke-width="2" filter="url(#ras)"/>
  <text x="390" y="512" text-anchor="middle" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16.5" fill="#0B0B0C" font-weight="700">citation check</text>
  <text x="390" y="533" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#0B0B0C">check_citations()</text>
  <path d="M278 516 H212" fill="none" stroke="#0B0B0C" stroke-width="2.5" stroke-linecap="round" marker-end="url(#raac)"/>
  <rect x="16" y="480" width="190" height="72" rx="14" fill="#0B0B0C"/>
  <text x="111" y="510" text-anchor="middle" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#FFFFFF" font-weight="700">answer with sources</text>
  <text x="111" y="534" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#FFD619">[palm.txt:5]</text>
