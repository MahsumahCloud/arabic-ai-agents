<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="rat rad" lang="en">
  <title id="rat">The research assistant</title>
  <desc id="rad">A question enters the agent loop, which plans, searches and reads local documents under a step limit, a cost budget and loop detection; every citation is checked before the answer is returned.</desc>
  <defs>
    <pattern id="rap" width="56" height="56" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#0B0B0C" stroke-width="1">
        <path d="M28.0 15.0 L41.0 28.0 L28.0 41.0 L15.0 28.0 Z"/>
        <path d="M28.0 22.0 L34.0 28.0 L28.0 34.0 L22.0 28.0 Z" opacity="0.6"/>
      </g>
      <g fill="#0B0B0C"><circle cx="0" cy="0" r="1.3"/><circle cx="56" cy="0" r="1.3"/><circle cx="0" cy="56" r="1.3"/><circle cx="56" cy="56" r="1.3"/></g>
    </pattern>
    <radialGradient id="rapg" gradientUnits="userSpaceOnUse" cx="480" cy="300" r="620">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="0.35" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="rapm"><rect width="100%" height="100%" fill="url(#rapg)"/></mask>
    <filter id="ras" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0B0B0C" flood-opacity="0.05"/><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B0B0C" flood-opacity="0.1"/></filter>
    <marker id="raac" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5 0.8 L9.5 5 L0.5 9.2 z" fill="#0B0B0C"/></marker><marker id="raav" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5 0.8 L9.5 5 L0.5 9.2 z" fill="#8A8781"/></marker><marker id="raar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5 0.8 L9.5 5 L0.5 9.2 z" fill="#0B0B0C"/></marker><marker id="raam" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5 0.8 L9.5 5 L0.5 9.2 z" fill="#6A6862"/></marker>
  </defs>
  <rect width="960" height="580" rx="20" fill="#F7F4EC"/>
  <rect width="960" height="580" rx="20" fill="url(#rap)" opacity="0.05" mask="url(#rapm)"/>
  <rect x="0.75" y="0.75" width="958.5" height="578.5" rx="19.25" fill="none" stroke="#E2DED2" stroke-width="1.5"/>
  <rect x="22" y="16" width="22" height="22" rx="6" fill="#FFD619"/>
  <path d="M29 22 L34 27 L29 32" fill="none" stroke="#0B0B0C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="54" y="32" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#6A6862">lessons/03/research_agent.py</text>
  <rect x="300" y="70" width="112" height="54" rx="12" fill="#0B0B0C" stroke="#0B0B0C" stroke-width="1.6"/>
  <text x="356" y="93" text-anchor="middle" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#FFFFFF" font-weight="600">step limit</text>
  <text x="356" y="113" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#FFD619">max_steps</text>
  <rect x="424" y="70" width="112" height="54" rx="12" fill="#0B0B0C" stroke="#0B0B0C" stroke-width="1.6"/>
  <text x="480" y="93" text-anchor="middle" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#FFFFFF" font-weight="600">cost budget</text>
  <text x="480" y="113" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#FFD619">budget</text>
  <rect x="548" y="70" width="112" height="54" rx="12" fill="#0B0B0C" stroke="#0B0B0C" stroke-width="1.6"/>
