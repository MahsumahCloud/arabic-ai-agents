  <text x="604" y="113" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#FFD619">loop_detected</text>
  <path d="M480 126 V148" fill="none" stroke="#0B0B0C" stroke-width="2" stroke-linecap="round" marker-end="url(#raar)"/>
  <rect x="20" y="240" width="150" height="84" rx="14" fill="#FFFFFF" stroke="#0B0B0C" stroke-width="1.6" filter="url(#ras)"/>
  <text x="95" y="276" text-anchor="middle" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="21" fill="#0B0B0C" font-weight="700">question</text>
  <text x="95" y="302" text-anchor="middle" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#6A6862">in Arabic</text>
  <path d="M172 282 H292" fill="none" stroke="#0B0B0C" stroke-width="2.5" stroke-linecap="round" marker-end="url(#raac)"/>
  <rect x="300" y="152" width="360" height="290" rx="22" fill="#FFFFFF" stroke="#0B0B0C" stroke-width="2.4" filter="url(#ras)"/>
  <text x="480" y="186" text-anchor="middle" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="21" fill="#0B0B0C" font-weight="700">agent loop</text>
  <rect x="325" y="208" width="130" height="58" rx="29" fill="#FFFFFF" stroke="#0B0B0C" stroke-width="1.6" filter="url(#ras)"/>
  <text x="390" y="233" text-anchor="middle" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#0B0B0C" font-weight="600">1. plan</text>
  <text x="390" y="253" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#6A6862">write_plan</text>
  <rect x="505" y="208" width="130" height="58" rx="29" fill="#FFFFFF" stroke="#0B0B0C" stroke-width="1.6" filter="url(#ras)"/>
  <text x="570" y="233" text-anchor="middle" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#0B0B0C" font-weight="600">2. search</text>
  <text x="570" y="253" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#6A6862">search_documents</text>
  <rect x="505" y="300" width="130" height="58" rx="29" fill="#FFFFFF" stroke="#0B0B0C" stroke-width="1.6" filter="url(#ras)"/>
  <text x="570" y="325" text-anchor="middle" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#0B0B0C" font-weight="600">3. read</text>
  <text x="570" y="345" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#6A6862">read_document</text>
  <rect x="325" y="300" width="130" height="58" rx="29" fill="#FFFFFF" stroke="#0B0B0C" stroke-width="1.6" filter="url(#ras)"/>
  <text x="390" y="325" text-anchor="middle" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#0B0B0C" font-weight="600">4. answer</text>
  <text x="390" y="345" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#6A6862">end_turn</text>
  <path d="M457 237 H499" fill="none" stroke="#0B0B0C" stroke-width="2" stroke-linecap="round" marker-end="url(#raac)"/>
  <path d="M570 268 V294" fill="none" stroke="#0B0B0C" stroke-width="2" stroke-linecap="round" marker-end="url(#raac)"/>
  <path d="M503 329 H461" fill="none" stroke="#0B0B0C" stroke-width="2" stroke-linecap="round" marker-end="url(#raac)"/>
  <text x="480" y="392" text-anchor="middle" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#6A6862">memory: the whole conversation is sent on every call</text>
  <text x="480" y="416" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#9A978F">self.messages</text>
  <rect x="730" y="190" width="200" height="176" rx="14" fill="#FFFFFF" stroke="#8A8781" stroke-width="1.8" filter="url(#ras)"/>
  <text x="830" y="222" text-anchor="middle" font-family="'Montserrat','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#0B0B0C" font-weight="700">local documents</text>
  <text x="830" y="254" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#6A6862">calligraphy.txt</text>
  <text x="830" y="278" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#6A6862">hijri.txt</text>
  <text x="830" y="302" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#6A6862">palm.txt</text>
  <text x="830" y="326" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#6A6862">solar.txt</text>
